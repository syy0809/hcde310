<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Art Search</title>
</head>
<body>
    <h1>Art Search</h1>
    <form action="/results" method="get">
        <label for="search">Search for artwork:</label>

        <p>
            <input
                type="text"
                id="search"
                name="term"
                placeholder="e.g., monet"
            >
        </p>

        <p>
            <button type="submit">Search</button>
        </p>
    </form>

    <!-- Show a helpful message when the search cannot continue -->
    {% if message %}
        <p role="alert">{{ message }}</p>
    {% endif %}
</body>
</html>
