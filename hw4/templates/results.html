<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
</head>
<body>
    <!-- AI-written: Results page based on my sketch -->
    <h1>Search Results</h1>

    <h2>Artworks Found</h2>

    {% for artwork in artworks %}
        <div>
            <p>Title: {{ artwork.title or "Unknown title" }}</p>
            <p>Artist: {{ artwork.artist_title or "Unknown artist" }}</p>
            <p>Date: {{ artwork.date_display or "Unknown date" }}</p>
        </div>
        <hr>
    {% endfor %}

    <a href="/">Back to Search</a>
</body>
</html>
